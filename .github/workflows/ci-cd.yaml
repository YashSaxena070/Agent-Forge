name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Code Quality
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Ruff
      run: ruff check .

    - name: Run MyPy
      run: mypy apps/backend/src

    - name: Run Bandit
      run: bandit -r apps/backend/src -f json -o bandit-report.json || true

    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: bandit-report.json

  # Frontend linting
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: apps/frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./apps/frontend
      run: npm ci

    - name: Run ESLint
      working-directory: ./apps/frontend
      run: npm run lint

    - name: Run TypeScript check
      working-directory: ./apps/frontend
      run: npm run typecheck

  # Backend Tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agentforge_test
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.9.0
        ports: [6333:6333]
        options: --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:6333/health" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run database migrations
      env:
        DATABASE_URL: postgresql+asyncpg://agentforge:agentforge_test@localhost:5432/agentforge_test
      run: |
        cd apps/backend
        alembic upgrade head

    - name: Run tests
      env:
        DATABASE_URL: postgresql+asyncpg://agentforge:agentforge_test@localhost:5432/agentforge_test
        REDIS_URL: redis://localhost:6379/0
        QDRANT_URL: http://localhost:6333
        ENVIRONMENT: testing
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        cd apps/backend
        pytest --cov=src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./apps/backend/coverage.xml
        flags: backend

  # Frontend Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: apps/frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./apps/frontend
      run: npm ci

    - name: Run tests
      working-directory: ./apps/frontend
      run: npm run test:coverage

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./apps/frontend/coverage/lcov.info
        flags: frontend

  # Security Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run dependency check
      run: |
        pip install safety
        safety check --json --output safety-report.json || true

    - name: Upload safety report
      uses: actions/upload-artifact@v4
      with:
        name: safety-report
        path: safety-report.json

  # Build and Push Docker Images
  build-backend:
    name: Build Backend Image
    needs: [lint-and-typecheck, backend-tests, security-scan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: infra/docker/Dockerfile.backend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Image
    needs: [frontend-lint, frontend-tests, security-scan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: infra/docker/Dockerfile.frontend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-worker:
    name: Build Worker Image
    needs: [lint-and-typecheck, backend-tests, security-scan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: infra/docker/Dockerfile.worker
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    needs: [build-backend, build-frontend, build-worker]
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Kubernetes
      uses: azure/k8s-set-context@v4
      with:
        kubeconfig: ${{ secrets.KUBECONFIG_STAGING }}

    - name: Update image tags
      run: |
        sed -i 's|agentforge/backend:.*|agentforge/backend:${{ github.sha }}|g' infra/kubernetes/overlays/staging/kustomization.yaml
        sed -i 's|agentforge/frontend:.*|agentforge/frontend:${{ github.sha }}|g' infra/kubernetes/overlays/staging/kustomization.yaml
        sed -i 's|agentforge/worker:.*|agentforge/worker:${{ github.sha }}|g' infra/kubernetes/overlays/staging/kustomization.yaml

    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -k infra/kubernetes/overlays/staging

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/agentforge-backend -n agentforge --timeout=300s
        kubectl rollout status deployment/agentforge-frontend -n agentforge --timeout=300s

    - name: Run smoke tests
      run: |
        sleep 30
        curl -f https://staging-api.agentforge.example.com/health/ready
        curl -f https://staging-app.agentforge.example.com/

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    needs: [build-backend, build-frontend, build-worker]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Kubernetes
      uses: azure/k8s-set-context@v4
      with:
        kubeconfig: ${{ secrets.KUBECONFIG_PRODUCTION }}

    - name: Update image tags
      run: |
        sed -i 's|agentforge/backend:.*|agentforge/backend:${{ github.sha }}|g' infra/kubernetes/overlays/production/kustomization.yaml
        sed -i 's|agentforge/frontend:.*|agentforge/frontend:${{ github.sha }}|g' infra/kubernetes/overlays/production/kustomization.yaml
        sed -i 's|agentforge/worker:.*|agentforge/worker:${{ github.sha }}|g' infra/kubernetes/overlays/production/kustomization.yaml

    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -k infra/kubernetes/overlays/production

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/agentforge-backend -n agentforge --timeout=300s
        kubectl rollout status deployment/agentforge-frontend -n agentforge --timeout=300s

    - name: Run smoke tests
      run: |
        sleep 30
        curl -f https://api.agentforge.example.com/health/ready
        curl -f https://app.agentforge.example.com/

    - name: Notify deployment
      if: always()
      uses: slackapi/slack-github-action@v1.25.0
      with:
        payload: |
          {
            "text": "Deployment to production ${{ job.status }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Deployment to production ${{ job.status }}*"
                }
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Commit: ${{ github.sha }} | Branch: ${{ github.ref_name }} | Workflow: ${{ github.workflow }}"
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
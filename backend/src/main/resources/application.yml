spring:
  application:
    name: agentforge-backend

  profiles:
    active: dev

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agentforge}
    username: ${DATABASE_USERNAME:agentforge}
    password: ${DATABASE_PASSWORD:agentforge_dev}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:dummy-github-id}
            client-secret: ${GITHUB_CLIENT_SECRET:dummy-github-secret}
            scope: read:user,user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-secret}
            scope: openid,email,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: login
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: 8080
  servlet:
    context-path: /api
    session:
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-base64-encoded==}
  rsa-private-key: classpath:keys/private_key.pem
  rsa-public-key: classpath:keys/public_key.pem
  access-token-expiration: 900000 # 15 minutes
  refresh-token-expiration: 2592000000 # 30 days
  algorithm: RS256
  issuer: agentforge
  audience: agentforge-api

opa:
  url: ${OPA_URL:http://localhost:8181}
  token: ${OPA_TOKEN:}

vault:
  url: ${VAULT_URL:http://localhost:8200}
  token: ${VAULT_TOKEN:}
  namespace: ${VAULT_NAMESPACE:}
  mount-point: secret

mfa:
  totp:
    issuer: AgentForge
  webauthn:
    rp-id: localhost
    rp-name: AgentForge
    origin: http://localhost:3000
  max-failed-attempts: 5
  lockout-minutes: 15

backup:
  directory: /backups
  retention-days: 30
  schedule: "0 2 * * *"

encryption:
  key: ${ENCRYPTION_KEY:your-32-byte-base64-encryption-key==}

logging:
  level:
    com.agentforge: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
spring:
  datasource:
    url: jdbc:postgresql://localhost:9000/agentforge?options=-c%20TimeZone=UTC
    username: postgres
    password: password

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration


apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentforge-ingress
  namespace: agentforge
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
  - hosts:
    - api.agentforge.example.com
    - app.agentforge.example.com
    secretName: agentforge-tls
  rules:
  - host: api.agentforge.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agentforge-backend
            port:
              number: 8000
  - host: app.agentforge.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agentforge-frontend
            port:
              number: 3000
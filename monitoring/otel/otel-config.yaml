receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          static_configs:
            - targets: ['localhost:8888']

  # Host metrics
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
      disk:
      load:
      memory:
      network:
      paging:
      processes:

processors:
  batch:
    timeout: 10s
    send_batch_size: 1000

  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  resource:
    attributes:
      - key: service.name
        value: "agentforge"
        action: upsert
      - key: deployment.environment
        value: "production"
        action: upsert

  # Filter out health check noise
  filter:
    spans:
      span:
        - 'name == "GET /health/live"'
        - 'name == "GET /health/ready"'
        - 'name == "GET /metrics"'

  # Add Kubernetes attributes
  k8sattributes:
    auth_type: "service_account"
    extract:
      metadata:
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.namespace.name
        - k8s.deployment.name
        - k8s.node.name
        - k8s.pod.start_time
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection

exporters:
  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: agentforge
    send_timestamps: true
    metric_expiration: 1800s

  loki:
    endpoint: http://loki:3100/api/v1/push
    labels:
      attributes:
        - service.name
        - deployment.environment
        - k8s.namespace.name
        - k8s.pod.name
    default_labels_enabled:
      service_name: true
      service_namespace: true

  logging:
    loglevel: debug

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  pprof:
    endpoint: 0.0.0.0:1777

  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, filter, k8sattributes]
      exporters: [otlp, logging]

    metrics:
      receivers: [otlp, prometheus, hostmetrics]
      processors: [memory_limiter, batch, resource, k8sattributes]
      exporters: [prometheus, logging]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, k8sattributes]
      exporters: [loki, logging]
server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_duration: 5m
  max_block_bytes: 1_000_000

compactor:
  compaction:
    block_retention: 30d
    compacted_block_retention: 1h

storage:
  trace:
    backend: local
    local:
      path: /tempo/traces
    pool:
      max_workers: 100
      queue_depth: 10000

overrides:
  defaults:
    metrics_generator_processors: [service-graphs, span-metrics]

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: agentforge
  storage:
    path: /tempo/metrics
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true